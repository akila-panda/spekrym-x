[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sx-core"
version = "0.1.0"
description = "spekrym-x shared contracts, causality harness, storage and ledger"
requires-python = ">=3.12"
dependencies = [
  "pydantic==2.14.1",
  "numpy==2.5.4",
  "pandas==3.1.0",
  "pyarrow==26.0.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.2"]

[tool.setuptools.packages.find]
where = ["src"]
