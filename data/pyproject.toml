[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sx-data"
version = "0.1.0"
description = "spekrym-x market data layer: OANDA practice client, resampling, quality checks, cache"
requires-python = ">=3.12"
dependencies = [
  "sx-core",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.2"]

[tool.setuptools.packages.find]
where = ["src"]
