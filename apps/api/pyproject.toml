[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sx-api"
version = "0.1.0"
description = "spekrym-x API (Phase 5A): /health and /premarket; other routes are empty placeholders"
requires-python = ">=3.12"
dependencies = [
  "sx-core",
  "sx-data",
  "sx-assistant",
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.2"]

[tool.setuptools.packages.find]
where = ["src"]
